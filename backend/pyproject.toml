[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regops-api"
version = "0.1.0"
description = "Phase 0 RegOps API contract implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "openapi-spec-validator==0.9.0",
    "pytest==8.4.1",
    "PyYAML==6.0.2",
    "ruff==0.16.0",
]

[project.scripts]
regops-api = "regops_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["openapi_spec_validator.*", "yaml"]
ignore_missing_imports = true
